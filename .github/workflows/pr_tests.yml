name: PR Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/pr_tests.yml"
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run the full test suite (17 shards)"
        required: false
        default: false
        type: boolean

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.action != 'labeled' || github.event.label.name == 'full-test'
    env:
      NODE_1: "wakuorg/nwaku:latest"
      NODE_2: "wakuorg/nwaku:latest"
      ADDITIONAL_NODES: "wakuorg/nwaku:latest,wakuorg/nwaku:latest,wakuorg/nwaku:latest"
      RLN_CREDENTIALS: ${{ secrets.RLN_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          pytest -m "smoke and not docker_required" \
            --reruns 1 \
            -n 4 \
            --dist=loadgroup \
            --junit-xml=smoke-results.xml 

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Smoke Test Results
          path: smoke-results.xml
          reporter: java-junit
          use-actions-summary: "true"

  full-suite:
    name: Full Suite
    if: >-
      contains(github.event.pull_request.labels.*.name, 'full-test') ||
      github.event.inputs.run_full_suite == 'true'
    uses: ./.github/workflows/test_common.yml
    secrets: inherit
    with:
      node1: "wakuorg/nwaku:latest"
      node2: "wakuorg/nwaku:latest"
      additional_nodes: "wakuorg/nwaku:latest,wakuorg/nwaku:latest,wakuorg/nwaku:latest"
      caller: "pr"
      deploy_allure: false
      send_discord: false